# edge — the single reverse proxy for this host.
#
# The only process that binds :80/:443. Every app runs in its own repo and
# container and joins the shared "edge" network; this proxy routes by hostname.
# Apps never reference each other.
#
#   docker network create edge        # once per host
#   docker compose up -d --build
name: edge

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: edge-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # OVH DNS credentials (used for the *.nohonu.com wildcard, DNS-01) live
    # outside the repo, e.g. /etc/edge/edge.env with mode 600.
    env_file:
      - path: /etc/edge/edge.env
        required: false
    volumes:
      # Mount only what Caddy reads; the proxy never sees .git, .env, etc.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - ./snippets:/etc/caddy/snippets:ro
      - caddy-data:/data
      - caddy-config:/config
      # Access logs written by snippets/logging.caddyfile.
      - access-logs:/var/log/caddy
      # GoAccess's generated report, served at logs.unrom.com.
      - stats-report:/srv/stats:ro
      # Basic-auth hash for that report. Read via {file.*} at config load, so
      # rotating it is a reload rather than a recreate.
      - /etc/edge/stats-auth:/etc/edge/stats-auth:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Container stdout is a debugging fallback, not the log sink; cap it so a
    # chatty Caddy cannot fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Regenerates the traffic report from Caddy's access logs every five minutes.
  # No network, no ports, no shell beyond the loop: the report is a file, and
  # Caddy serves it at logs.unrom.com. Opt in with `--profile stats`.
  #
  # Requires the access-logs volume written by the log snippet. Country and
  # ASN panels stay empty until a MaxMind database is mounted (see README).
  goaccess:
    image: allinurl/goaccess:1.12
    profiles: ["stats"]
    # The image's ENTRYPOINT is the goaccess binary, so the loop has to be the
    # entrypoint; `command` alone would be passed to goaccess as arguments.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          goaccess /logs/*.log --log-format=CADDY \
            --output=/report/index.html --no-progress || true
          sleep 300
        done
    volumes:
      - access-logs:/logs:ro
      - stats-report:/report
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: unless-stopped

# The shared network is created once on the host:
#   docker network create edge
# Every app and the proxy join it as an external network.
networks:
  edge:
    external: true
    name: edge

volumes:
  caddy-data:
  caddy-config:
  access-logs:
  stats-report:
