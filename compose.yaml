# edge — the single reverse proxy for this host.
#
# The only process that binds :80/:443. Every app runs in its own repo and
# container and joins the shared "edge" network; this proxy routes by hostname.
# Apps never reference each other.
#
#   docker network create edge        # once per host
#   docker compose up -d --build
name: edge

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: edge-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # OVH DNS credentials (used for the *.nohonu.com wildcard, DNS-01) live
    # outside the repo, e.g. /etc/edge/edge.env with mode 600.
    env_file:
      - path: /etc/edge/edge.env
        required: false
    volumes:
      # Mount only what Caddy reads; the proxy never sees .git, .env, etc.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - ./snippets:/etc/caddy/snippets:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# The shared network is created once on the host:
#   docker network create edge
# Every app and the proxy join it as an external network.
networks:
  edge:
    external: true
    name: edge

volumes:
  caddy-data:
  caddy-config:
