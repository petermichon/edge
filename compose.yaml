# edge — the single reverse proxy for this host.
#
# The only process that binds :80/:443. Every app runs in its own repo and
# container and joins the shared "edge" network; this proxy routes by hostname.
# Apps never reference each other.
#
#   docker network create edge        # once per host
#   docker compose up -d --build
name: edge

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: edge-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # OVH DNS credentials, used for the *.nohonu.com wildcard (DNS-01).
      OVH_ENDPOINT: ${OVH_ENDPOINT}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY}
    volumes:
      # Bind the repo directory (not the single Caddyfile) so `git pull`
      # replacements are visible without recreating the container.
      - ./:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    restart: unless-stopped

# The shared network is created once on the host:
#   docker network create edge
# Every app and the proxy join it as an external network.
networks:
  edge:
    external: true
    name: edge

volumes:
  caddy-data:
  caddy-config:
