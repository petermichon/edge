# Protect the publicly exposed opencode endpoint from Basic-auth brute force.
# Docker publishes 443 and DNATs to the Caddy container, so the ban must hook
# the forward path, not input. A dedicated nftables table avoids clashing with
# the sshd jail's default chain.
[opencode]
enabled  = true
filter   = caddy-opencode
logpath  = /var/lib/docker/volumes/edge_access-logs/_data/opencode.log
backend  = auto
maxretry = 10
findtime = 10m
bantime  = 1h
ignoreip = 127.0.0.1/8 ::1 172.20.0.0/16 10.0.0.0/8 192.168.0.0/16 169.254.0.0/16
action   = nftables[type=allports, table=f2b-opencode, chain=forward, chain_hook=forward, chain_priority=-10, name=opencode, blocktype=drop]
