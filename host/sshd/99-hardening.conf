# Host SSH baseline for the edge box. Debian reads sshd_config.d/*.conf.
# Key-only already; these close the remaining conveniences.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
# Local forwards stay available for the documented opencode port forward.
AllowTcpForwarding local
MaxAuthTries 3
